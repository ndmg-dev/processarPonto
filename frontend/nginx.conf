server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Headers básicos (§8.2 da reestruturação) — mitiga clickjacking/sniffing
    # mesmo antes de qualquer outra camada de segurança existir.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # Proxy pro backend — o próprio motivo de rodarem `vite dev` em produção
    # era o proxy de /api que o servidor de dev do Vite já tinha configurado
    # (ver vite.config.ts). Sem isso aqui, upload/consulta quebra com 405
    # (a requisição cai no Nginx estático, que não conhece rota nenhuma).
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }

    # SPA: toda rota sem arquivo correspondente cai no index.html
    # (React Router cuida do resto no client).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
