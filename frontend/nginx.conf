server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Headers básicos (§8.2 da reestruturação) — mitiga clickjacking/sniffing
    # mesmo antes de qualquer outra camada de segurança existir.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # SPA: toda rota sem arquivo correspondente cai no index.html
    # (React Router cuida do resto no client).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
