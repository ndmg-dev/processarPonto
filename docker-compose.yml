version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT:-8010}:8000"
    environment:
      - DATABASE_URL=sqlite:///./sql_app.db
    # prepared for postgresql
    # depends_on:
    #   - db

  # db: só para rodar os testes de RLS localmente (db/tests). Não é usado em
  # produção, onde o Postgres é o do Supabase. Ver db/README.md.
  db:
    image: postgres:15
    profiles: ["test"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:?defina TEST_DB_PASSWORD antes de subir o banco de teste}
      POSTGRES_DB: postgres
    ports:
      - "${TEST_DB_PORT:-55432}:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-5176}:80"
    depends_on:
      - backend

volumes:
  postgres_test_data:
